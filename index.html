  <script>
    const revealItems = document.querySelectorAll('.reveal');
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (!prefersReducedMotion) {
      const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('in-view');
          }
        });
      }, {
        threshold: 0.16
      });

      revealItems.forEach((item) => revealObserver.observe(item));
    } else {
      revealItems.forEach((item) => item.classList.add('in-view'));
    }

    const shell = document.getElementById('horizontal-shell');
    const sticky = shell.querySelector('.horizontal-sticky');
    const track = document.getElementById('horizontal-track');

    function updateHorizontalScroll() {
      if (window.innerWidth <= 760 || prefersReducedMotion) {
        track.style.transform = 'translate3d(0, 0, 0)';
        return;
      }

      const rect = shell.getBoundingClientRect();
      const maxScroll = shell.offsetHeight - window.innerHeight;
      const progress = Math.min(Math.max(-rect.top / maxScroll, 0), 1);
      const maxTranslate = track.scrollWidth - window.innerWidth;
      const move = maxTranslate * progress;
      track.style.transform = `translate3d(${-move}px, 0, 0)`;
    }

    window.addEventListener('scroll', updateHorizontalScroll, { passive: true });
    window.addEventListener('resize', updateHorizontalScroll);
    window.addEventListener('load', updateHorizontalScroll);
    updateHorizontalScroll();
  </script>

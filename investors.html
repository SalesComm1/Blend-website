<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLEND | For Investors</title>
  <meta name="description" content="BLEND seed round investor materials. Passcode-protected." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fffaf7;
      --panel: rgba(255, 255, 255, 0.9);
      --text: #171717;
      --muted: #686868;
      --soft-text: #3a3a3a;
      --purple: #9b5cff;
      --purple-soft: rgba(155, 92, 255, 0.12);
      --blue: #50a7ff;
      --cyan: #7edfd2;
      --gold: #ffc97a;
      --gold-soft: rgba(255, 201, 122, 0.18);
      --pink: #ff78ac;
      --pink-soft: rgba(255, 120, 172, 0.12);
      --shadow: 0 18px 48px rgba(17, 17, 17, 0.08);
      --radius: 22px;
      --max: 1180px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.55;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 { top: -200px; left: -180px; width: 520px; height: 520px; background: radial-gradient(circle, var(--purple), transparent 70%); }
    .blob-2 { bottom: -240px; right: -160px; width: 560px; height: 560px; background: radial-gradient(circle, var(--pink), transparent 70%); }
    .blob-3 { top: 40%; right: -140px; width: 360px; height: 360px; background: radial-gradient(circle, var(--gold), transparent 70%); opacity: 0.25; }

    /* ===== GATE UI ===== */
    .gate-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      position: relative;
      z-index: 1;
    }
    .gate-card {
      background: var(--panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(17, 17, 17, 0.06);
      border-radius: 32px;
      box-shadow: var(--shadow);
      max-width: 460px;
      width: 100%;
      padding: 48px 40px 40px;
      text-align: center;
    }
    .gate-brand {
      font-weight: 900;
      font-size: 36px;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, var(--purple), var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 6px;
    }
    .gate-tagline {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 36px;
    }
    .gate-lock {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple-soft), var(--pink-soft));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .gate-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin: 0 0 8px;
    }
    .gate-sub {
      font-size: 14px;
      color: var(--muted);
      margin: 0 0 28px;
    }
    .gate-form { display: flex; flex-direction: column; gap: 14px; }
    .gate-input {
      font-family: inherit;
      font-size: 16px;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1.5px solid rgba(17, 17, 17, 0.1);
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      letter-spacing: 0.02em;
    }
    .gate-input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(155, 92, 255, 0.15); }
    .gate-btn {
      font-family: inherit;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.02em;
      padding: 14px 24px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(90deg, var(--purple), var(--pink));
      color: #fff;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.15s ease;
    }
    .gate-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(155, 92, 255, 0.32); }
    .gate-btn:disabled { opacity: 0.7; cursor: wait; transform: none; }
    .gate-error {
      color: #d63b6c;
      font-size: 13px;
      font-weight: 600;
      margin-top: 6px;
      min-height: 20px;
      transition: opacity 0.2s ease;
    }
    .gate-error.show { opacity: 1; }
    .gate-foot {
      margin-top: 28px;
      font-size: 12px;
      color: var(--muted);
    }
    .gate-foot a { color: var(--purple); text-decoration: none; }
    .gate-foot a:hover { text-decoration: underline; }
    .shake { animation: shake 0.4s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* ===== MAIN CONTENT (revealed after unlock) ===== */
    .content {
      display: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      max-width: var(--max);
      margin: 0 auto;
      padding: 28px 28px 80px;
      position: relative;
      z-index: 1;
    }
    .content.visible { display: block; opacity: 1; }
    .back-link {
      display: inline-block;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1.5px solid rgba(17, 17, 17, 0.08);
      margin-bottom: 28px;
      transition: all 0.15s ease;
    }
    .back-link:hover { background: rgba(17, 17, 17, 0.04); }

    .hero { padding: 48px 0 32px; }
    .hero-title {
      font-size: clamp(38px, 6vw, 72px);
      font-weight: 900;
      letter-spacing: -0.035em;
      line-height: 1.02;
      margin: 14px 0 22px;
    }
    .hero-grad {
      background: linear-gradient(90deg, var(--purple), var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hero-lead {
      font-size: clamp(16px, 1.6vw, 19px);
      color: var(--soft-text);
      max-width: 760px;
      line-height: 1.55;
    }

    .section { padding: 56px 0; border-top: 1px solid rgba(17,17,17,0.06); }
    .section:first-of-type, .hero { border-top: none; }
    .section h2 {
      font-size: clamp(28px, 3.6vw, 44px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.08;
      margin: 12px 0 18px;
      max-width: 920px;
    }
    .section-lead {
      font-size: 17px;
      color: var(--soft-text);
      max-width: 820px;
      margin: 0 0 28px;
      line-height: 1.6;
    }

    .kicker {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
    }
    .kicker-pink { background: var(--pink-soft); color: var(--pink); }
    .kicker-purple { background: var(--purple-soft); color: var(--purple); }
    .kicker-gold { background: var(--gold-soft); color: #b67917; }
    .kicker-cyan { background: rgba(126, 223, 210, 0.22); color: #1f8074; }

    /* Stat rows */
    .stat-row { display: grid; gap: 16px; margin-top: 8px; }
    .stat-row-3 { grid-template-columns: repeat(3, 1fr); }
    .stat-row-4 { grid-template-columns: repeat(4, 1fr); }
    @media (max-width: 880px) {
      .stat-row-3, .stat-row-4 { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 540px) {
      .stat-row-3, .stat-row-4 { grid-template-columns: 1fr; }
    }
    .stat-card {
      background: #fff;
      border: 1px solid rgba(17,17,17,0.06);
      border-left: 4px solid var(--purple);
      border-radius: 18px;
      padding: 22px 22px 20px;
      box-shadow: 0 6px 20px rgba(17,17,17,0.04);
    }
    .stat-card-purple { border-left-color: var(--purple); }
    .stat-card-pink { border-left-color: var(--pink); }
    .stat-card-gold { border-left-color: var(--gold); }
    .stat-num {
      font-size: 40px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--purple);
      margin-bottom: 10px;
    }
    .stat-num-text { font-size: 32px; }
    .stat-card-pink .stat-num { color: var(--pink); }
    .stat-card-gold .stat-num { color: #b67917; }
    .stat-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .stat-desc { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .stat-card-tight {
      background: #fff;
      border: 1px solid rgba(17,17,17,0.06);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(17,17,17,0.04);
    }
    .stat-card-tight .stat-num { font-size: 36px; color: var(--purple); }
    .stat-card-tight .stat-label { font-size: 13px; }
    .stat-card-tight .stat-foot { font-size: 11px; color: var(--muted); margin-top: 8px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }

    /* Two-column / panels */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .two-col-flip { grid-template-columns: 1fr 1fr; }
    @media (max-width: 800px) { .two-col, .two-col-flip { grid-template-columns: 1fr; } }
    .panel {
      background: #fff;
      border: 1px solid rgba(17,17,17,0.06);
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 6px 20px rgba(17,17,17,0.04);
    }
    .panel-eyebrow {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 14px;
    }
    .panel-stat {
      font-size: 56px;
      font-weight: 900;
      color: var(--purple);
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 12px;
    }
    .panel-text { color: var(--soft-text); margin: 0; }
    .panel-quote {
      font-style: italic;
      font-weight: 500;
      font-size: 17px;
      color: var(--text);
      margin: 0 0 4px;
      border-left: 3px solid var(--purple);
      padding-left: 14px;
    }
    .panel-attr {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 18px;
      padding-left: 17px;
    }
    .panel-attr:last-child { margin-bottom: 0; }

    /* Card rows */
    .card-row { display: grid; gap: 18px; margin-top: 12px; }
    .card-row-2 { grid-template-columns: 1fr 1fr; }
    .card-row-3 { grid-template-columns: repeat(3, 1fr); }
    @media (max-width: 900px) { .card-row-3, .card-row-2 { grid-template-columns: 1fr; } }
    .info-card {
      background: #fff;
      border: 1px solid rgba(17,17,17,0.06);
      border-radius: 20px;
      padding: 26px 24px;
      box-shadow: 0 6px 20px rgba(17,17,17,0.04);
    }
    .info-card h3 { margin: 0 0 8px; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
    .info-card p { margin: 0; color: var(--soft-text); font-size: 14.5px; line-height: 1.55; }
    .info-card-icon {
      font-size: 24px;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--purple-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }
    .info-card-num {
      font-size: 14px;
      font-weight: 700;
      color: var(--purple);
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    /* Demo section */
    .section-demo { background: linear-gradient(135deg, rgba(155,92,255,0.05), rgba(255,120,172,0.05)); margin: 56px -28px; padding: 56px 28px; border-radius: 32px; border-top: none; }
    .demo-box {
      background: #fff;
      border: 1px solid rgba(17,17,17,0.06);
      border-radius: 22px;
      padding: 36px 30px;
      box-shadow: var(--shadow);
      max-width: 560px;
      text-align: center;
    }
    .demo-label {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 12px;
    }
    .demo-number {
      font-size: clamp(36px, 6vw, 56px);
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, var(--purple), var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 14px;
    }
    .demo-sub { font-size: 13px; color: var(--muted); line-height: 1.5; }

    /* Product cards */
    .product-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 12px; }
    @media (max-width: 900px) { .product-row { grid-template-columns: 1fr; } }
    .product-card {
      background: #fff;
      border: 1px solid rgba(17,17,17,0.06);
      border-top: 4px solid var(--purple);
      border-radius: 18px;
      padding: 28px 24px 24px;
      box-shadow: 0 6px 20px rgba(17,17,17,0.04);
    }
    .product-card-sara { border-top-color: var(--purple); }
    .product-card-cassie { border-top-color: var(--pink); }
    .product-card-leo { border-top-color: var(--gold); }
    .product-tag {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .product-card-sara .product-tag { color: var(--purple); }
    .product-card-cassie .product-tag { color: var(--pink); }
    .product-card-leo .product-tag { color: #b67917; }
    .product-sub {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 14px;
    }
    .product-tagline {
      font-style: italic;
      font-size: 13.5px;
      color: var(--soft-text);
      margin: 0 0 16px;
      line-height: 1.5;
    }
    .product-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 13.5px;
      color: var(--soft-text);
    }
    .product-list li {
      padding: 8px 0 8px 18px;
      position: relative;
      border-top: 1px solid rgba(17,17,17,0.04);
      line-height: 1.5;
    }
    .product-list li:first-child { border-top: none; }
    .product-list li::before {
      content: '';
      position: absolute;
      left: 0; top: 16px;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--purple);
    }
    .product-card-cassie .product-list li::before { background: var(--pink); }
    .product-card-leo .product-list li::before { background: var(--gold); }

    /* Bullets / quote panels */
    .bullet-panel { padding: 26px; }
    .bullet-eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 14px; }
    .bullet-list { padding: 0; margin: 0; list-style: none; }
    .bullet-list li {
      padding: 12px 0 12px 24px;
      position: relative;
      border-top: 1px solid rgba(17,17,17,0.06);
      font-size: 15px;
      color: var(--soft-text);
    }
    .bullet-list li:first-child { border-top: none; }
    .bullet-list li::before {
      content: '';
      position: absolute; left: 0; top: 18px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--purple);
    }
    .result-panel {
      background: linear-gradient(135deg, var(--purple-soft), var(--pink-soft));
      border-radius: 22px;
      padding: 36px 28px;
      text-align: center;
    }
    .result-eyebrow { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--purple); font-weight: 700; margin-bottom: 18px; }
    .result-arrow {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      margin-bottom: 16px;
    }
    .result-from { font-size: 32px; font-weight: 700; color: var(--muted); text-decoration: line-through; }
    .result-arrow-icon { font-size: 24px; color: var(--purple); }
    .result-to { font-size: 64px; font-weight: 900; color: var(--purple); letter-spacing: -0.04em; line-height: 1; }
    .result-caption { font-size: 14px; color: var(--text); font-weight: 600; margin-bottom: 8px; }
    .result-foot { font-size: 12px; color: var(--muted); }
    .quad-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 700px) { .quad-grid { grid-template-columns: 1fr; } }
    .quad-cell {
      background: #fff;
      border: 1px solid rgba(17,17,17,0.06);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(17,17,17,0.04);
    }
    .quad-title { font-weight: 800; font-size: 16px; margin-bottom: 6px; color: var(--pink); }
    .quad-cell p { margin: 0; font-size: 14px; color: var(--soft-text); line-height: 1.55; }

    .quote-panel {
      background: linear-gradient(135deg, var(--gold-soft), var(--pink-soft));
      border-radius: 22px;
      padding: 40px 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .quote-big {
      font-size: clamp(20px, 2.6vw, 28px);
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.2;
      margin: 0;
      text-align: center;
    }

    /* Band callout */
    .band-callout {
      margin-top: 24px;
      background: linear-gradient(90deg, var(--purple-soft), var(--pink-soft));
      border-radius: 14px;
      padding: 14px 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      font-size: 13.5px;
      color: var(--soft-text);
    }
    .band-callout strong { color: var(--text); }

    /* TAM grid */
    .tam-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 24px; }
    @media (max-width: 720px) { .tam-grid { grid-template-columns: 1fr; } }
    .tam-cell {
      background: #fff;
      border: 1px solid rgba(17,17,17,0.06);
      border-radius: 16px;
      padding: 22px 20px;
      text-align: center;
    }
    .tam-cell-accent {
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: #fff;
      border: none;
    }
    .tam-eyebrow { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.7; font-weight: 700; margin-bottom: 8px; }
    .tam-num { font-size: 36px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; margin-bottom: 8px; }
    .tam-cell .tam-num { color: var(--purple); }
    .tam-cell-accent .tam-num { color: #fff; }
    .tam-desc { font-size: 12.5px; opacity: 0.75; line-height: 1.4; }

    /* Callouts / case studies */
    .callout {
      margin-top: 24px;
      background: #fff;
      border: 1px solid rgba(17,17,17,0.06);
      border-left: 4px solid var(--purple);
      border-radius: 16px;
      padding: 20px 24px;
    }
    .callout-eyebrow { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--purple); font-weight: 700; margin-bottom: 8px; }
    .callout p { margin: 0; color: var(--soft-text); font-size: 14.5px; line-height: 1.6; }

    .case-study {
      margin-top: 28px;
      background: linear-gradient(135deg, var(--purple-soft), var(--pink-soft));
      border-radius: 22px;
      padding: 28px 28px 24px;
    }
    .case-eyebrow { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--purple); font-weight: 700; margin-bottom: 8px; }
    .case-title { margin: 0 0 12px; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
    .case-body { margin: 0 0 20px; color: var(--soft-text); font-size: 14.5px; line-height: 1.6; }
    .case-stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 600px) { .case-stat-row { grid-template-columns: 1fr; } }
    .case-stat {
      background: rgba(255,255,255,0.7);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
    }
    .case-stat-num { display: block; font-size: 22px; font-weight: 900; color: var(--purple); letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 4px; }
    .case-stat-label { display: block; font-size: 12px; color: var(--muted); }

    /* Pricing */
    .pricing-panel, .lever-panel {
      background: #fff;
      border: 1px solid rgba(17,17,17,0.06);
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 6px 20px rgba(17,17,17,0.04);
    }
    .pricing-eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 16px; }
    .pricing-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 0; border-top: 1px solid rgba(17,17,17,0.06); font-size: 14.5px; }
    .pricing-row:first-of-type { border-top: none; padding-top: 0; }
    .pricing-name { color: var(--text); font-weight: 600; }
    .pricing-price { color: var(--purple); font-weight: 800; }
    .pricing-add { color: var(--muted); font-weight: 500; font-size: 13px; }
    .pricing-total { background: var(--purple-soft); margin: 12px -10px 0; padding: 14px 14px; border-radius: 12px; border-top: none; }
    .pricing-total .pricing-price { color: var(--purple); }
    .lever-item { padding: 12px 0; border-top: 1px solid rgba(17,17,17,0.06); }
    .lever-item:first-of-type { border-top: none; padding-top: 0; }
    .lever-item h4 { margin: 0 0 4px; font-size: 14.5px; font-weight: 800; }
    .lever-item p { margin: 0; font-size: 13px; color: var(--soft-text); line-height: 1.5; }

    /* Forecast */
    .forecast-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .forecast-cell {
      flex: 1 1 220px;
      background: #fff;
      border: 1px solid rgba(17,17,17,0.06);
      border-radius: 18px;
      padding: 24px;
      text-align: center;
    }
    .forecast-cell-accent {
      background: linear-gradient(135deg, var(--purple), var(--pink));
      border: none;
      color: #fff;
    }
    .forecast-eyebrow { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.7; font-weight: 700; margin-bottom: 8px; }
    .forecast-num { font-size: 40px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; color: var(--purple); margin-bottom: 6px; }
    .forecast-cell-accent .forecast-num { color: #fff; }
    .forecast-label { font-size: 13px; color: var(--muted); }
    .forecast-cell-accent .forecast-label { color: rgba(255,255,255,0.85); }
    .forecast-arrow { font-size: 22px; color: var(--purple); flex: 0 0 auto; }
    @media (max-width: 700px) { .forecast-arrow { transform: rotate(90deg); margin: 0 auto; } }

    /* Compare table */
    .compare-table {
      margin-top: 12px;
      background: #fff;
      border: 1px solid rgba(17,17,17,0.06);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(17,17,17,0.04);
    }
    .compare-row { display: grid; grid-template-columns: 1.6fr repeat(4, 1fr); border-top: 1px solid rgba(17,17,17,0.06); }
    .compare-row:first-child { border-top: none; }
    .compare-head { background: rgba(17,17,17,0.03); font-size: 12px; font-weight: 700; }
    .compare-cell, .compare-cell-label { padding: 14px 12px; font-size: 13.5px; text-align: center; color: var(--soft-text); border-left: 1px solid rgba(17,17,17,0.06); }
    .compare-cell-label { text-align: left; font-weight: 600; color: var(--text); border-left: none; }
    .compare-cell-us { background: var(--purple-soft); color: var(--purple); font-weight: 800; }
    @media (max-width: 760px) {
      .compare-row { grid-template-columns: 1fr 1fr; }
      .compare-head { display: none; }
      .compare-cell-label { background: rgba(17,17,17,0.04); }
    }

    .caption { margin-top: 18px; font-size: 13px; color: var(--muted); line-height: 1.6; }

    /* Team grid */
    .team-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 12px; }
    @media (max-width: 1000px) { .team-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 560px) { .team-grid { grid-template-columns: 1fr; } }
    .team-card {
      background: #fff;
      border: 1px solid rgba(17,17,17,0.06);
      border-top: 4px solid var(--purple);
      border-radius: 18px;
      padding: 24px 22px 22px;
      box-shadow: 0 6px 20px rgba(17,17,17,0.04);
    }
    .team-card-purple { border-top-color: var(--purple); }
    .team-card-pink { border-top-color: var(--pink); }
    .team-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 17px;
      letter-spacing: 0.02em;
      margin-bottom: 16px;
      background: var(--purple-soft);
      color: var(--purple);
    }
    .team-card-pink .team-avatar { background: var(--pink-soft); color: var(--pink); }
    .team-name { font-size: 16px; font-weight: 800; margin-bottom: 2px; }
    .team-role { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--purple); margin-bottom: 12px; }
    .team-card-pink .team-role { color: var(--pink); }
    .team-card p { margin: 0; font-size: 13px; color: var(--soft-text); line-height: 1.55; }

    /* Phase row */
    .phase-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 12px; }
    @media (max-width: 980px) { .phase-row { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 540px) { .phase-row { grid-template-columns: 1fr; } }
    .phase-cell {
      background: #fff;
      border: 1px solid rgba(17,17,17,0.06);
      border-radius: 16px;
      padding: 22px 20px;
    }
    .phase-num {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800;
      background: var(--purple-soft);
      color: var(--purple);
      margin-bottom: 12px;
      font-size: 14px;
    }
    .phase-when { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
    .phase-title { font-size: 15px; font-weight: 800; margin-bottom: 8px; }
    .phase-cell p { margin: 0; font-size: 13px; color: var(--soft-text); line-height: 1.5; }

    /* Milestone grid */
    .milestone-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 12px; }
    @media (max-width: 980px) { .milestone-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 540px) { .milestone-grid { grid-template-columns: 1fr; } }
    .milestone-cell {
      background: #fff;
      border: 1px solid rgba(17,17,17,0.06);
      border-radius: 16px;
      padding: 20px;
    }
    .milestone-month { font-size: 13px; font-weight: 800; color: var(--purple); margin-bottom: 16px; letter-spacing: 0.05em; }
    .milestone-cat { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-top: 12px; margin-bottom: 4px; }
    .milestone-cell p { margin: 0 0 4px; font-size: 13.5px; color: var(--soft-text); line-height: 1.45; }

    /* The Ask */
    .ask-target {
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: #fff;
      border-radius: 22px;
      padding: 32px 28px;
    }
    .ask-target-num { font-size: 64px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; margin-bottom: 8px; }
    .ask-target-label { font-size: 14px; font-weight: 700; opacity: 0.85; margin-bottom: 4px; }
    .ask-target-sub { font-size: 12px; opacity: 0.75; margin-bottom: 24px; }
    .ask-investor-eyebrow { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.85; font-weight: 700; margin-bottom: 10px; }
    .ask-investor-list { padding: 0; margin: 0; list-style: none; }
    .ask-investor-list li {
      font-size: 14px;
      padding: 8px 0 8px 18px;
      position: relative;
      border-top: 1px solid rgba(255,255,255,0.18);
    }
    .ask-investor-list li:first-child { border-top: none; }
    .ask-investor-list li::before {
      content: '';
      position: absolute; left: 0; top: 16px;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #fff;
    }
    .ask-use {
      background: #fff;
      border: 1px solid rgba(17,17,17,0.06);
      border-radius: 22px;
      padding: 28px;
    }
    .ask-use-eyebrow { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 18px; }
    .ask-use-row {
      display: flex; align-items: flex-start; gap: 16px;
      padding: 14px 0;
      border-top: 1px solid rgba(17,17,17,0.06);
    }
    .ask-use-row:first-of-type { border-top: none; padding-top: 0; }
    .ask-pct {
      flex: 0 0 50px;
      font-size: 22px;
      font-weight: 900;
      color: var(--purple);
      letter-spacing: -0.02em;
    }
    .ask-cat { display: flex; flex-direction: column; }
    .ask-cat strong { font-size: 14px; font-weight: 800; }
    .ask-cat span { font-size: 12.5px; color: var(--muted); }

    /* Closing */
    .section-close { padding: 80px 0 24px; text-align: center; border-top: none; }
    .close-title {
      font-size: clamp(28px, 4vw, 44px);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.1;
      max-width: 760px;
      margin: 0 auto 36px;
    }
    .close-grad {
      background: linear-gradient(90deg, var(--purple), var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .close-contact {
      display: inline-flex;
      flex-direction: column;
      gap: 4px;
      padding: 24px 36px;
      background: #fff;
      border: 1px solid rgba(17,17,17,0.06);
      border-radius: 22px;
      box-shadow: var(--shadow);
      text-align: left;
    }
    .close-name { font-size: 18px; font-weight: 800; }
    .close-role { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
    .close-email, .close-site { font-size: 14px; color: var(--soft-text); }

    /* Reveal-on-scroll polish */
    .reveal { opacity: 0; transform: translateY(8px); transition: opacity 0.5s ease, transform 0.5s ease; }
    .reveal.in-view, .content.visible .reveal { opacity: 1; transform: none; }
  </style>

  <script>
    (function() {
      var BLOB_B64 = document.getElementById('encBlob').textContent.trim();
      var ITERATIONS = 250000;
      var SALT_LEN = 16;
      var IV_LEN = 12;
      var subtle = (window.crypto && window.crypto.subtle) ? window.crypto.subtle : null;

      var form = document.getElementById('gateForm');
      var input = document.getElementById('gatePass');
      var btn = document.getElementById('gateBtn');
      var errorEl = document.getElementById('gateError');
      var gateCard = document.getElementById('gateCard');
      var gateWrap = document.getElementById('gateWrap');
      var contentWrap = document.getElementById('contentWrap');

      function b64ToBytes(b64) {
        var bin = atob(b64);
        var out = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
      }

      async function tryDecrypt(passcode) {
        if (!subtle) throw new Error('Web Crypto not available in this browser.');
        var blob = b64ToBytes(BLOB_B64);
        var salt = blob.slice(0, SALT_LEN);
        var iv = blob.slice(SALT_LEN, SALT_LEN + IV_LEN);
        var ctAndTag = blob.slice(SALT_LEN + IV_LEN);

        var passKey = await subtle.importKey(
          'raw',
          new TextEncoder().encode(passcode),
          'PBKDF2',
          false,
          ['deriveKey']
        );
        var key = await subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: ITERATIONS, hash: 'SHA-256' },
          passKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
        var ptBuf = await subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ctAndTag);
        return new TextDecoder().decode(ptBuf);
      }

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.classList.add('show');
        gateCard.classList.remove('shake');
        // restart the animation
        void gateCard.offsetWidth;
        gateCard.classList.add('shake');
      }

      function reveal(html) {
        contentWrap.innerHTML = html;
        gateWrap.style.display = 'none';
        contentWrap.classList.add('visible');
        // smooth-up reveal animations
        requestAnimationFrame(function() {
          var els = contentWrap.querySelectorAll('.reveal');
          els.forEach(function(el, i) {
            setTimeout(function() { el.classList.add('in-view'); }, 30 * i);
          });
        });
        // store for session so a refresh keeps you in
        try { sessionStorage.setItem('blend_inv_pc', input.value); } catch (e) {}
      }

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        errorEl.classList.remove('show');
        btn.disabled = true;
        btn.textContent = 'Unlocking…';
        try {
          var html = await tryDecrypt(input.value);
          reveal(html);
        } catch (err) {
          showError('Incorrect passcode. Try again.');
          input.select();
        } finally {
          btn.disabled = false;
          btn.textContent = 'Unlock';
        }
      });

      // Auto-unlock if a valid passcode is in sessionStorage (refresh continuity)
      (async function autoUnlock() {
        try {
          var saved = sessionStorage.getItem('blend_inv_pc');
          if (!saved) return;
          var html = await tryDecrypt(saved);
          input.value = saved;
          reveal(html);
        } catch (e) {
          try { sessionStorage.removeItem('blend_inv_pc'); } catch (_) {}
        }
      })();
    })();
  </script>

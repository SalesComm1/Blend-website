<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BLEND | AI-Powered Call & Text Concierge</title>

<style>
/* ================= LOGO TIGHTEN ================= */
.logo-wrap,
.hero-logo-wrap {
  padding: 0;
  margin: 0;
}

.logo-img {
  height: 130px;
  display: block;
  filter: drop-shadow(0 8px 20px rgba(0,0,0,0.25));
}

.site-header.scrolled .logo-img {
  height: 70px;
}

.hero-logo-img {
  height: clamp(200px, 26vw, 380px);
  display: block;
  filter: drop-shadow(0 20px 50px rgba(0,0,0,0.3));
}

/* ================= REMOVE EXTRA SPACE ================= */
.hero-logo-stage {
  margin-bottom: 0;
}

/* ================= NAV CLEANUP ================= */
.nav-link[href="#selling-points"] {
  display: none;
}

/* ================= STEP 2 FLIPPED ================= */
.solution-block {
  display: grid;
  grid-template-columns: 1fr 1fr;
}

.solution-block .story-copy {
  order: 2;
}

.solution-block .solution-grid {
  order: 1;
}

/* ================= BUTTON STYLE DIFFERENTIATION ================= */
.solution-card {
  border-radius: 14px;
  padding: 18px;
  background: rgba(255,255,255,0.7);
  box-shadow: none;
  border: 1px solid rgba(0,0,0,0.06);
  transition: all 0.2s ease;
}

.solution-card:hover {
  transform: translateY(-2px);
  background: rgba(255,255,255,0.9);
}

/* ================= CHAT → SUBTLE PHONE FEEL ================= */
.chat-card {
  background: #f8f3ef;
  border-radius: 28px;
  padding: 18px;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
  position: relative;
}

/* subtle top notch hint */
.chat-card::before {
  content: "";
  width: 60px;
  height: 6px;
  background: rgba(0,0,0,0.15);
  border-radius: 999px;
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  opacity: 0.4;
}

/* bubbles refined */
.bubble {
  border-radius: 18px;
  padding: 12px 14px;
  font-size: 0.95rem;
}

.bubble.client {
  background: rgba(0,0,0,0.05);
}

.bubble.blend {
  background: linear-gradient(135deg, #ff78ac, #ffc97a);
}

/* ================= GENERAL ================= */
body {
  font-family: Inter, sans-serif;
}
</style>
</head>

<body>

<header class="site-header">
  <div class="nav">
    <div></div>

    <a class="brand" href="#">
      <div class="logo-wrap">
        <img src="blend-new-logo.png" class="logo-img" />
      </div>
    </a>

    <div></div>
  </div>
</header>

<section class="hero">
  <div class="hero-logo-stage">
    <div class="hero-logo-wrap">
      <img src="blend-new-logo.png" class="hero-logo-img" />
    </div>
  </div>
</section>

<section id="solution" class="solution-block">
  <div class="story-copy">
    <h2>BLEND replies like a polished front desk that never clocks out.</h2>
    <p>
      It answers quickly, keeps the tone warm, captures useful details,
      and moves guests toward the next step without friction.
    </p>
  </div>

  <div class="solution-grid">
    <div class="solution-card"><strong>Answers fast</strong></div>
    <div class="solution-card"><strong>Sounds human</strong></div>
    <div class="solution-card"><strong>Guides the guest</strong></div>
  </div>
</section>

<section>
  <div class="chat-card">
    <div class="bubble client">Hi, do you have openings tomorrow?</div>
    <div class="bubble blend">Yes, I can help with that.</div>
  </div>
</section>

</body>
</html>

    :root {

    .paint::after {

    .paint-2 {

    .paint-3 {

    .paint-3::after {

      background: rgba(155, 92, 255, 0.46);
      filter: blur(8px);
    }

    .paint-4 {
      top: 72%;

      width: 150px;
      height: 150px;
      background: rgba(126, 223, 210, 0.08);
      filter: blur(18px);
    }
    .paint-4::before {
      inset: 18px 55px 65px 10px;
      background: rgba(255, 201, 122, 0.52);
      filter: blur(8px);
    }
    .paint-4::after {
      inset: 70px 18px 10px 70px;
      background: rgba(80, 167, 255, 0.46);
      filter: blur(8px);
    }

    }

    .site-header.scrolled {
      background: rgba(255, 250, 247, 0.96);
      box-shadow: 0 8px 24px rgba(17,17,17,0.06);
    }

    .nav {

    .nav-left, .nav-right {
      display: flex;

    .nav-right { justify-content: flex-end; }

    .contact-chip {

    .contact-chip strong { color: var(--text); }

    .brand {

    .logo-wrap {

    .hero-logo-stage.hidden {
      opacity: 0;
      transform: translateY(-18px) scale(0.94);
      pointer-events: none;
    }

    .hero-logo-wrap {
      --logo-badge-bg: rgba(255, 255, 255, 0.96);
      --logo-badge-border: rgba(17, 17, 17, 0.08);
      --logo-badge-shadow: 0 18px 40px rgba(17, 17, 17, 0.10);

      background: var(--logo-badge-bg);

    .hero-logo-img {

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px 26px;
      border-radius: 999px;
      border: 1px solid rgba(17, 17, 17, 0.06);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
      font-weight: 700;
      white-space: nowrap;
      color: #121212;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(17,17,17,0.08);
      letter-spacing: -0.01em;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(17, 17, 17, 0.12);
    }

    .btn-purple { background: var(--purple); }
    .btn-blue { background: var(--blue); }
    .btn-cyan { background: var(--cyan); }
    .btn-gold { background: var(--gold); }
    .btn-pink { background: var(--pink); }

    main { position: relative; z-index: 1; }

    section {
      padding: 56px 0;

      z-index: 2;

    .journey-section + .journey-section {
      margin-top: 8px;
    }

    .hero {
  padding: 32px 0 32px;
}

    .hero-shell,
    .panel,
    .stack-card,
    .cta,
    .talk-page,
    .story-block {
      background: var(--panel);
      border: 1px solid rgba(17, 17, 17, 0.08);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
    }

    .hero-shell {
      padding: 56px;
    }

    .hero-shell-simplified {
      display: grid;
      gap: 34px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(17,17,17,0.08);
      background: rgba(255,255,255,0.7);
      color: #9b6c2e;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 800;
      font-size: 0.82rem;
      margin-bottom: 18px;
    }

    h1, h2, h3, p { margin: 0; }

    h1 {
      font-size: clamp(3.2rem, 7vw, 6.4rem);
      line-height: 0.92;
      letter-spacing: -0.06em;
      max-width: 9ch;
      margin: 0 auto 18px;
      text-align: center;
    }

    .hero-copy {
      text-align: center;
      max-width: 840px;
      margin: 0 auto;
    }

    .hero-lead,
    .hero-copy p {
      color: var(--muted);
      font-size: 1.12rem;
      margin: 0 auto;
      max-width: 52ch;
      line-height: 1.55;
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .hero-actions-premium .btn {
      min-width: 190px;
    }

    .hero-mini-benefits {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .mini-benefit {
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(17,17,17,0.08);
      border-radius: 22px;
      padding: 22px;
      min-height: 118px;
      box-shadow: 0 10px 22px rgba(17,17,17,0.04);
    }

    .mini-benefit strong {
      display: block;
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .mini-benefit span {
      color: var(--muted);
      line-height: 1.5;
      display: block;
      font-size: 0.96rem;
    }

    .story-block {
      padding: 40px;
      display: grid;
      grid-template-columns: 1fr 0.9fr;
      gap: 28px;
      align-items: center;
    }

    .story-copy {
      max-width: 58ch;
    }

    .story-copy h2 {
      font-size: clamp(2.1rem, 4vw, 3.8rem);
      line-height: 0.96;
      letter-spacing: -0.05em;
      margin-bottom: 14px;
    }

    .story-copy p {
      color: var(--muted);
      font-size: 1.06rem;
      line-height: 1.6;
    }

    .story-side {
      display: grid;
      gap: 14px;
    }

    .story-stat,
    .solution-card {
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(17,17,17,0.08);
      border-radius: 20px;
      padding: 20px;
      min-height: 106px;
    }

    .story-stat strong,
    .solution-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: 1rem;
    }

    .story-stat span,
    .solution-card span {
      color: var(--muted);
      display: block;
      line-height: 1.5;
      font-size: 0.96rem;
    }

    .section-head {
      text-align: center;
      max-width: 780px;
      margin: 0 auto 28px;
    }

    .section-head-wide {
      margin-bottom: 34px;
    }

    .kicker {
      display: inline-block;
      margin-bottom: 10px;
      color: #9b6c2e;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .section-head h2 {
      font-size: clamp(2.2rem, 4vw, 3.8rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
      margin-bottom: 12px;
    }

    .section-head p,
    .panel p,
    .stack-card p,
    .cta p,
    .talk-page p,
    .chat-why,
    .number-caption {
      color: var(--muted);
      line-height: 1.6;
    }

    .selling-stack {
      display: grid;
      gap: 24px;
    }

    .proof-stack .panel {
      padding: 42px;
    }

    .panel {
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 30px;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .panel::after {
      content: "";
      position: absolute;
      inset: auto -40px -40px auto;
      width: 180px;
      height: 180px;
      border-radius: 999px;
      opacity: 0.14;
      background: var(--panel-accent, var(--purple));
      filter: blur(48px);
      pointer-events: none;
    }

    .panel-copy, .panel-visual { position: relative; z-index: 1; }

    .panel-index {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: rgba(17,17,17,0.04);
      border: 1px solid rgba(17,17,17,0.08);
      color: #5b4b3c;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .panel h3 {
      font-size: clamp(2.2rem, 4vw, 4.2rem);
      line-height: 0.94;
      letter-spacing: -0.05em;
      margin-bottom: 14px;
      max-width: 10ch;
    }

    .panel p {
      font-size: 1.04rem;
      margin-bottom: 20px;
    }

    .panel-visual { display: grid; gap: 16px; align-content: center; }

    .chat-card {
      background: rgba(255,255,255,0.84);
      border: 1px solid rgba(17,17,17,0.08);
      border-radius: 26px;
      padding: 20px;
      display: grid;
      gap: 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }

    .chat-card-large {
      padding: 24px;
    }

    .chat-window {
      max-height: 400px;
      overflow-y: auto;
      padding-right: 8px;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: rgba(0,0,0,0.16) transparent;
    }

    .chat-window::-webkit-scrollbar { width: 8px; }
    .chat-window::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.14);
      border-radius: 999px;
    }

    .chat-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 800;
      color: #9b6c2e;
    }

    .chat-thread { display: grid; gap: 12px; }

    .bubble {
      max-width: 90%;
      padding: 14px 16px;
      border-radius: 20px;
      line-height: 1.48;
      font-size: 0.97rem;
      border: 1px solid rgba(17,17,17,0.08);
      box-shadow: 0 8px 20px rgba(17,17,17,0.06);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .animated-chat.play .bubble {
      opacity: 1;
      transform: translateY(0);
    }

    .animated-chat.play .bubble:nth-child(1) { transition-delay: 0.05s; }
    .animated-chat.play .bubble:nth-child(2) { transition-delay: 0.18s; }
    .animated-chat.play .bubble:nth-child(3) { transition-delay: 0.31s; }
    .animated-chat.play .bubble:nth-child(4) { transition-delay: 0.44s; }
    .animated-chat.play .bubble:nth-child(5) { transition-delay: 0.57s; }
    .animated-chat.play .bubble:nth-child(6) { transition-delay: 0.7s; }
    .animated-chat.play .bubble:nth-child(7) { transition-delay: 0.83s; }
    .animated-chat.play .bubble:nth-child(8) { transition-delay: 0.96s; }
    .animated-chat.play .bubble:nth-child(9) { transition-delay: 1.09s; }
    .animated-chat.play .bubble:nth-child(10) { transition-delay: 1.22s; }

    .bubble.client {
      justify-self: start;
      background: rgba(17,17,17,0.04);
      color: var(--text);
      border-top-left-radius: 8px;
    }

    .bubble.blend {
      justify-self: end;
      background: var(--bubble-accent, rgba(155,92,255,0.18));
      color: #121212;
      border-top-right-radius: 8px;
      border-color: transparent;
      font-weight: 600;
    }

    .chat-why {
      margin-top: 4px;
      padding-top: 12px;
      border-top: 1px solid rgba(17,17,17,0.08);
      font-size: 0.94rem;
    }

    .chat-why strong { color: var(--text); }

    .panel-1 { --panel-accent: var(--purple); --bubble-accent: var(--gold); }
    .panel-2 { --panel-accent: var(--gold); --bubble-accent: var(--cyan); }
    .panel-3 { --panel-accent: var(--blue); --bubble-accent: var(--pink); }

    .benefits-grid-large {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .stack-card {
      padding: 28px;
      min-height: 220px;
      position: relative;
      overflow: hidden;
      background: rgba(255,255,255,0.82);
    }

    .stack-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--card-top, var(--purple));
    }

    .stack-card:nth-child(1) { --card-top: var(--purple); }
    .stack-card:nth-child(2) { --card-top: var(--blue); }
    .stack-card:nth-child(3) { --card-top: var(--pink); }

    .stack-card h3 { font-size: 1.18rem; margin-bottom: 10px; }

    .talk-page {
      padding: 64px 48px;
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 0.92fr 1.08fr;
      gap: 38px;
      align-items: center;
      text-align: left;
      background: rgba(255,255,255,0.9);
    }

    .journey-moment .container {
      position: relative;
    }

    .talk-page::before {
      content: "";
      position: absolute;
      top: -60px;
      left: -60px;
      width: 220px;
      height: 220px;
      border-radius: 999px;
      background: var(--pink);
      opacity: 0.1;
      filter: blur(64px);
    }

    .talk-page::after {
      content: "";
      position: absolute;
      right: -70px;
      bottom: -50px;
      width: 260px;
      height: 260px;
      border-radius: 999px;
      background: var(--blue);
      opacity: 0.08;
      filter: blur(72px);
    }

    .talk-page > * { position: relative; z-index: 1; }

    .talk-copy { max-width: 620px; }

    .phone-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #9b6c2e;
      margin-bottom: 16px;
      font-weight: 800;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(17,17,17,0.08);
    }

    .talk-page h2 {
      font-size: clamp(2.6rem, 5vw, 5rem);
      line-height: 0.92;
      letter-spacing: -0.06em;
      margin-bottom: 16px;

    .talk-page p {
      max-width: 56ch;

      gap: 20px;

      width: min(100%, 360px);
      border-radius: 38px;

      max-width: 88%;

      grid-template-columns: 1.1fr auto;
      gap: 18px;
      align-items: center;
      position: relative;
      overflow: hidden;
      background: rgba(255,255,255,0.86);
    }

    .cta-final {
      margin: 0 0 24px;
    }

    .cta::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--cyan);
    }

    .bottom-contact {
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }

    .site-footer {
      padding: 32px 0 40px;
      color: rgba(17,17,17,0.58);
      font-size: 0.92rem;
    }

    .footer-row {
      border-top: 1px solid rgba(17,17,17,0.08);
      padding-top: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17,17,17,0.32);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 100;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: min(100%, 620px);
      background: rgba(255,255,255,0.98);
      border: 1px solid rgba(17,17,17,0.08);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 26px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid rgba(17,17,17,0.08);
      background: rgba(17,17,17,0.04);
      color: var(--text);
      font-size: 1.3rem;
      cursor: pointer;
    }

    .modal h3 {
      font-size: 2rem;
      margin-bottom: 8px;
      letter-spacing: -0.03em;
    }

    .modal p { color: var(--muted); margin-bottom: 18px; }

    .form-grid { display: grid; gap: 12px; }

    .form-grid label {
      display: grid;
      gap: 8px;
      font-size: 0.92rem;
      color: rgba(17,17,17,0.88);
    }

    .form-grid input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(17,17,17,0.08);
      background: rgba(17,17,17,0.03);
      color: var(--text);
      outline: none;
    }

    .form-grid input:focus {
      border-color: rgba(80,167,255,0.5);
      box-shadow: 0 0 0 3px rgba(80,167,255,0.12);
    }

    .form-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .reveal {
      opacity: 1;
      transform: none;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .reveal:not(.in-view) {
      opacity: 0.25;
      transform: translate3d(0, 18px, 0);
    }

    @media (prefers-color-scheme: dark) {
      .logo-wrap,
      .hero-logo-wrap {
        --logo-badge-bg: rgba(255, 255, 255, 0.10);
        --logo-badge-border: rgba(255, 255, 255, 0.14);
        --logo-badge-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      }

      .site-header.scrolled .logo-wrap {
        --logo-badge-bg: rgba(255, 255, 255, 0.14);
        --logo-badge-border: rgba(255, 255, 255, 0.16);
        --logo-badge-shadow: 0 10px 24px rgba(0, 0, 0, 0.30);
      }
    }

    @media (max-width: 1080px) {
      .hero-mini-benefits,
      .benefits-grid-large,
      .story-block,
      .panel,
      .talk-page,
      .cta {
        grid-template-columns: 1fr;
      }

      .panel h3,
      .talk-page h2,
      .story-copy h2 {
        max-width: none;
      }

      .talk-page,
      .story-block {
        text-align: center;
      }

      .story-copy,
      .talk-copy,
      .talk-page p,
      .talk-note {
        max-width: none;
        margin-left: auto;
        margin-right: auto;
      }

      .talk-actions,
      .hero-actions,
      .form-actions {
        justify-content: center;
      }
    }

    @media (max-width: 760px) {
      .hero-shell, .panel, .stack-card, .cta, .talk-page, .modal, .story-block {
        padding: 24px;
      }

      .nav {
        grid-template-columns: 1fr;
        padding: 18px 0;
      }

      .nav-left, .nav-right, .brand, .bottom-contact {
        justify-content: center;
      }

      h1 { max-width: none; }
      .contact-chip { white-space: normal; text-align: center; }
      .bubble { max-width: 100%; }
      .phone-mockup { width: 100%; max-width: 360px; }
      .logo-wrap {
        padding: 6px 10px;
      }
      .logo-img {
        height: 48px;
      }
      .hero-logo-wrap {
        padding: 0;
        border-radius: 0;
      }
      .hero-logo-img {
        height: clamp(90px, 18vw, 120px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .reveal, .reveal:not(.in-view), .bubble {
        opacity: 1;
        transform: none;
        transition: none;
      }
      .chat-window { scroll-behavior: auto; }
    }
  </style>
</head>
